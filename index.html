<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Stop Analyzer</title>
  <meta name="description" content="Analyze monthly packer and palletizer start/stop records in your browser. No data leaves your computer.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231f3a5f'/%3E%3Crect x='7' y='17' width='4' height='8' fill='%23f5a524'/%3E%3Crect x='14' y='11' width='4' height='14' fill='%23fff'/%3E%3Crect x='21' y='7' width='4' height='18' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Start Stop Analyzer</span>
      </div>
      <span class="privacy-badge" title="Files are read with JavaScript on this page. Nothing is uploaded.">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.7 8 11 4.6-1.3 8-6 8-11V5l-8-3Zm-1 14-4-4 1.4-1.4L11 13.2l4.6-4.6L17 10l-6 6Z"/></svg>
        Processed in your browser only
      </span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Sections">
      <button role="tab" data-tab="report" aria-selected="true">Report</button>
      <button role="tab" data-tab="burst" aria-selected="false">Burst Bag</button>
      <button role="tab" data-tab="quality" aria-selected="false">Data Quality <span class="tab-badge" id="qualityBadge" hidden></span></button>
      <button role="tab" data-tab="rules" aria-selected="false">Rules</button>
    </nav>
  </header>

  <main id="main">
    <!-- Upload (shown until a file is loaded) -->
    <section id="loader" class="loader">
      <label class="dropzone" id="dropzone" for="fileInput">
        <svg viewBox="0 0 24 24" width="40" height="40" aria-hidden="true"><path fill="currentColor" d="M19 15v4H5v-4H3v6h18v-6h-2ZM11 5.8V16h2V5.8l3.6 3.6L18 8l-6-6-6 6 1.4 1.4L11 5.8Z"/></svg>
        <strong>Drop START_STOP_PACKER_&lt;MONTH&gt;.xlsx here</strong>
        <span>or click to choose a file. You can add several months.</span>
      </label>
      <div class="loader-actions">
        <button class="btn btn-ghost" id="sampleBtn" type="button">Try with sample data</button>
      </div>
      <p class="fineprint">Your file is read by this page in your browser. It is never uploaded to any server.</p>
    </section>

    <!-- Toolbar (shown after a file is loaded) -->
    <section id="toolbar" class="toolbar" hidden>
      <div class="toolbar-left">
        <label class="field">
          <span>Month</span>
          <select id="monthSelect"></select>
        </label>
        <div class="fileinfo" id="fileInfo"></div>
      </div>
      <div class="toolbar-right">
        <button class="btn" id="changeBtn" type="button">Change file</button>
        <button class="btn btn-primary" id="pdfBtn" type="button">Export PDF</button>
      </div>
    </section>

    <section id="tab-report" class="panel" data-panel="report"></section>
    <section id="tab-burst" class="panel" data-panel="burst" hidden></section>
    <section id="tab-quality" class="panel" data-panel="quality" hidden></section>
    <section id="tab-rules" class="panel" data-panel="rules" hidden></section>
  </main>

  <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" multiple hidden>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <footer class="footer">Start Stop Analyzer · runs entirely in your browser · <a href="https://github.com/fadzly27/start-stop-analyzer">source</a></footer>
</body>
</html>
