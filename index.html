<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start Stop Analyzer</title>
  <meta name="description" content="Analyze monthly packer and palletizer start/stop Excel logs in your browser and export a 3-page A4 landscape PDF report.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231d3557'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='system-ui,sans-serif' font-size='13' font-weight='700' fill='%23ffffff'%3ESS%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar no-print">
    <div class="topbar-inner">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">SS</span>
        <span class="brand-name">Start Stop</span>
      </div>

      <nav class="seg-wrap nav-desktop" role="tablist" aria-label="Sections">
        <button class="seg-btn" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button class="seg-btn" role="tab" data-tab="routing" aria-selected="false">Routing</button>
        <button class="seg-btn" role="tab" data-tab="pdf" aria-selected="false">PDF</button>
        <button class="seg-btn" role="tab" data-tab="issues" aria-selected="false">Issues <span class="tab-count" id="issuesBadge" hidden></span></button>
      </nav>

      <div class="topbar-actions">
        <button class="pill-btn" id="themeBtn" type="button" title="Switch Light / Dark mode" aria-label="Switch Light or Dark mode">
          <span id="themeIcon">☾</span><span id="themeText" class="hide-sm">Dark</span>
        </button>
        <select class="pill-select" id="monthSelect" aria-label="Select month" hidden></select>
        <button class="pill-btn" id="uploadBtn" type="button">+ Upload</button>
        <button class="pill-btn pill-primary" id="pdfBtn" type="button" hidden>Export PDF</button>
      </div>
    </div>

    <div class="nav-mobile">
      <nav class="seg-wrap" role="tablist" aria-label="Sections">
        <button class="seg-btn" role="tab" data-tab="overview" aria-selected="true">Overview</button>
        <button class="seg-btn" role="tab" data-tab="routing" aria-selected="false">Routing</button>
        <button class="seg-btn" role="tab" data-tab="pdf" aria-selected="false">PDF</button>
        <button class="seg-btn" role="tab" data-tab="issues" aria-selected="false">Issues <span class="tab-count" id="issuesBadgeMob" hidden></span></button>
      </nav>
    </div>
  </header>

  <main id="main" class="main no-print">
    <section id="loader" class="loader">
      <label class="dropzone" id="dropzone" for="fileInput">
        <div class="drop-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4m0 0-4 4m4-4 4 4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/>
          </svg>
        </div>
        <h1>Drop Monthly Start Stop Excel</h1>
        <p>Click or drag <code>START STOP PACKER &lt;MONTH&gt;.xlsx</code> here. You can add multiple months.</p>
        <span class="drop-pill">Choose Excel File</span>
      </label>
      <div class="loader-foot">
        <button class="link-btn" id="sampleBtn" type="button">Try with sample data</button>
        <span class="dot-sep">·</span>
        <span>100% browser-only · No files uploaded</span>
      </div>
    </section>

    <section id="tab-overview" class="panel" data-panel="overview" hidden></section>
    <section id="tab-routing" class="panel" data-panel="routing" hidden></section>
    <section id="tab-pdf" class="panel" data-panel="pdf" hidden></section>
    <section id="tab-issues" class="panel" data-panel="issues" hidden></section>
  </main>

  <!-- Dedicated 3-Page A4 Landscape Print Container -->
  <div id="printReport" class="print-report" aria-hidden="true"></div>

  <!-- Drill-down Modal -->
  <dialog id="drillDialog" class="drill-dialog" aria-labelledby="drillTitle">
    <div class="drill-head">
      <div>
        <h2 id="drillTitle"></h2>
        <p id="drillSub"></p>
      </div>
      <button class="pill-btn icon-only" id="drillClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="drill-body" id="drillBody"></div>
  </dialog>

  <input type="file" id="fileInput" accept=".xlsx,.xlsm,.xls" multiple hidden>
  <div class="toast no-print" id="toast" role="status" aria-live="polite" hidden></div>
  <footer class="footer no-print">Start Stop Analyzer · Offline in your browser · <a href="https://github.com/fadzly27/start-stop-analyzer" target="_blank" rel="noopener">GitHub</a></footer>
</body>
</html>
